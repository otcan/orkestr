<div class="modal-backdrop" (click)="cancel.emit()">
  <form class="worker-dialog vault-dialog" (click)="$event.stopPropagation()" (ngSubmit)="submit()" autocomplete="off" data-analytics-ignore>
    <h3>{{ editing ? "Edit " + item?.name : "Add to vault" }}</h3>

    <label>
      <span>Name</span>
      <input name="name" [(ngModel)]="name" required autocomplete="off" placeholder="Example Mail">
    </label>
    <label>
      <span>Website URL</span>
      <input name="url" type="url" [(ngModel)]="url" autocomplete="off" placeholder="https://mail.example.com">
    </label>
    <label>
      <span>Username</span>
      <input name="username" [(ngModel)]="username" autocomplete="off" placeholder="user@example.com">
    </label>

    <div class="vault-field">
      <label for="vault-password">Password</label>
      <div class="vault-inline">
        <input id="vault-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" autocomplete="new-password"
          data-analytics-ignore data-private spellcheck="false" [placeholder]="editing ? 'Leave blank to keep the current password' : ''">
        <button class="secondary" type="button" (click)="showPassword = !showPassword">{{ showPassword ? "Hide" : "Show" }}</button>
        <button class="secondary" type="button" (click)="generate(); generatorOpen = true">Generate</button>
      </div>
    </div>
    @if (generatorOpen) {
      <div class="vault-generator">
        <label class="vault-length">
          <span>Length {{ length }}</span>
          <input name="length" type="range" [min]="minLength" [max]="maxLength" [ngModel]="length" (ngModelChange)="setLength($event)">
        </label>
        <div class="vault-inline">
          <label class="checkbox-row"><input name="lower" type="checkbox" [ngModel]="charsets.lower" (ngModelChange)="toggleCharset('lower', $event)"> a–z</label>
          <label class="checkbox-row"><input name="upper" type="checkbox" [ngModel]="charsets.upper" (ngModelChange)="toggleCharset('upper', $event)"> A–Z</label>
          <label class="checkbox-row"><input name="digits" type="checkbox" [ngModel]="charsets.digits" (ngModelChange)="toggleCharset('digits', $event)"> 0–9</label>
          <label class="checkbox-row"><input name="symbols" type="checkbox" [ngModel]="charsets.symbols" (ngModelChange)="toggleCharset('symbols', $event)"> !&#64;#</label>
        </div>
      </div>
    }
    @if (editing && item?.hasPassword && !password) {
      <label class="checkbox-row"><input name="clearPassword" type="checkbox" [(ngModel)]="clearPassword"> Remove saved password</label>
    }

    <label>
      <span>Notes</span>
      <textarea name="notes" rows="3" [(ngModel)]="notes" (ngModelChange)="notesTouched = true" autocomplete="off"
        data-analytics-ignore data-private [placeholder]="editing ? 'Leave untouched to keep current notes' : ''"></textarea>
    </label>

    <label>
      <span>Authenticator</span>
      <input name="authenticator" [(ngModel)]="authenticator" autocomplete="off" spellcheck="false" data-analytics-ignore data-private
        [placeholder]="editing && item?.hasTotp ? 'Leave blank to keep the current authenticator' : 'Paste an otpauth:// link or setup key'">
    </label>
    <ork-vault-qr-scan (scanned)="applyScanned($event)"></ork-vault-qr-scan>
    @if (editing && item?.hasTotp && !authenticator) {
      <label class="checkbox-row"><input name="clearAuthenticator" type="checkbox" [(ngModel)]="clearAuthenticator"> Remove authenticator</label>
    }

    @if (localError || error) {
      <p class="vault-form-error" role="alert">{{ localError || error }}</p>
    }
    <div class="dialog-actions">
      <button class="secondary" type="button" (click)="cancel.emit()">Cancel</button>
      <button type="submit" [disabled]="busy">{{ busy ? "Saving…" : "Save" }}</button>
    </div>
  </form>
</div>
