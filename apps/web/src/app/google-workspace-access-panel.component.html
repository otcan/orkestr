<section class="workspace-access" aria-labelledby="google-access-heading">
  <div class="workspace-access-head">
    <div>
      <strong id="google-access-heading">Google account</strong>
      <small>Google handles account selection and consent.</small>
    </div>
  </div>

  @if (accounts.length) {
    <label>
      <span>Account</span>
      <select name="google-access-account" [(ngModel)]="selectedAccountId" (ngModelChange)="selectAccount($event)">
        <option value="">Add another Google account</option>
        @for (account of accounts; track account.connectionId) {
          <option [value]="account.connectionId">{{ accountLabel(account) }}</option>
        }
      </select>
    </label>
  }

  @if (error) {
    <p class="inline-error">{{ error }}</p>
  }

  <button type="button" (click)="connect()" [disabled]="!canContinue()">
    {{ busy ? "Opening Google" : selectedAccountId ? "Reconnect Google account" : "Continue to Google" }}
  </button>
</section>
