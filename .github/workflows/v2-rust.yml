name: Orkestr 2.0 intake checks

on:
  push:
    branches: [v2/rust-rewrite, v2/s0-core]
    paths: ['v2/**', '.github/workflows/v2-rust.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolate candidate data and build output
        run: |
          echo "ORKESTR_V2_HOME=$RUNNER_TEMP/orkestr-v2-intake" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/orkestr-v2-target" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Architecture boundaries
        run: python3 tests/check_boundaries.py
      - name: Rust format
        run: cargo +1.99.1 fmt --all -- --check
      - name: Rust lint
        run: cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Locked build
        run: cargo +1.99.1 build --locked --workspace
      - name: Unit and HTTP process-failure tests (requires Python 3)
        run: cargo +1.99.1 test --locked --workspace
