name: Orkestr 2.0 intake checks

on:
  push:
    branches: [v2/rust-rewrite]
    paths: ['v2/**', '.github/workflows/v2-rust.yml', 'scripts/security/cargo-*', 'scripts/security/dependency-*']
  pull_request:
    branches: ['v2/**']
    paths: ['v2/**', '.github/workflows/v2-rust.yml', 'scripts/security/cargo-*', 'scripts/security/dependency-*']
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR checks cancel; manual and integration push runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job used to run everything in sequence and took 30 to 47 minutes, most of
# it in `cargo test --workspace`. The same steps now run side by side: lint,
# the service and packaging regressions, the real-HTTP scenarios, and the
# workspace tests split across runners by exact test name. `rust-v2` remains the
# one check to look at: it needs every part and proves the test split is complete.
#
# The workflow policy allows no anchors, reusable workflows or local actions, so
# each job repeats the short runner preparation it needs.
#
# Dependency caches: every job except `unit` keeps its own (keyed by job name),
# because `-p` selections build other feature sets than `--workspace` does. The
# `unit` shards share the `rust-v2` cache the single job used to save.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolate build output
        run: |
          # Outside the checkout, at a fixed path relative to it so rust-cache can save it.
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/orkestr-v2-target" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: v2 -> ../../orkestr-v2-target
          # Only the integration branch saves; PRs restore its dependency build.
          save-if: ${{ github.ref == 'refs/heads/v2/rust-rewrite' }}
      - name: Rust format
        run: cargo +1.99.1 fmt --all -- --check
      - name: Rust lint
        run: cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Service packaging validates the candidate against its pinned manager ancestor.
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate candidate data and build output
        run: |
          echo "ORKESTR_V2_HOME=$RUNNER_TEMP/orkestr-v2-intake" >> "$GITHUB_ENV"
          # Outside the checkout, at a fixed path relative to it so rust-cache can save it.
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/orkestr-v2-target" >> "$GITHUB_ENV"
      - name: Install namespace test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor
      - name: Qualify hosted-runner lifetime namespace policy
        run: |
          python3 -B -m unittest discover -s tests -p test_ci_lifetime_namespace.py -v
          python3 tests/ci_lifetime_namespace.py
      - name: Probe unprivileged provider lifetime namespaces
        run: python3 tests/probe_lifetime_namespaces.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: v2 -> ../../orkestr-v2-target
          # Only the integration branch saves; PRs restore its dependency build.
          save-if: ${{ github.ref == 'refs/heads/v2/rust-rewrite' }}
      - name: Architecture boundaries
        run: python3 tests/check_boundaries.py
      - name: Workspace test split regressions
        run: python3 -B -m unittest discover -s tests -p test_ci_test_shards.py -v
      - name: Persistent manager ledger and owned-process regressions
        run: |
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_ledger.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_conversations.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_readmission.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_windows.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_clock.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_process.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_ownership_scale.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_thread_children.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_boundaries.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_bind_deadline.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_observation_deadline.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_native_state.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_service_exit_diagnostics.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_startup_diagnostics.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_output_items.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_protocol.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_model_observation.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_steer.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_worker_entry.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_codex_quota.py -v
      - name: Claude broker codec, full-access and owned-cleanup regressions
        run: |
          python3 -I -S -B -m unittest discover -s provider-broker -p 'test_claude_*.py' -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_reaping.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_host_full_access.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_fast_read_only.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_conversation_workspaces.py -v
      - name: Protected synthetic manager package regressions
        run: |
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_package.py -v
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_package_inventory.py -v
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_roles.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_password_recovery.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_identity.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_orphans.py -v
      - name: Protected browser target kernel proof
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_privileged_browser_target.py -v
      - name: Managed native capabilities and scoped helper regressions
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p 'test_codex_service_managed_*.py' -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_desk.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_launch.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_claude_custody.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_codex_service_fast_sampler.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p 'test_workspace_*.py' -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_split_qualification.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_resource_namespace.py -v
          python3 -I -S -B -m unittest discover -s provider-broker -p test_resource_verification_snapshot.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_resource_timers.py -v
      - name: Native conversation workspace projection kernel regressions
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/provider-broker" -p test_resource_native_workspaces.py -v
      - name: Service packager and passive quota inventory
        run: |
          python3 -I -S -B -m unittest discover -s packaging/service/tests -v
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/packaging/service/tests" -p test_selected.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/packaging/service/tests" -p test_selected_managed.py -v
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/packaging/service/tests" -p test_artifact_boundary.py -v
          sudo /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/packaging/service/tests" -p test_release.py -v
      - name: Kernel-bound service credentials and cache
        working-directory: ${{ github.workspace }}
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/v2/compat/tests" -p test_service_peer.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/v2/compat/tests" -p test_service_peer_handoff.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/v2/compat/tests" -p test_service_client.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -m unittest discover -s v2/compat/v1_runtime/tests -p test_service_session_cache.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -m unittest discover -s v2/compat/v1_runtime/tests -p test_provision_service_credential.py -v
      - name: Scoped V1 runtime compatibility regressions
        working-directory: ${{ github.workspace }}
        run: |
          python3 -B -m unittest discover -s v2/compat/v1_runtime/tests -v
          python3 -I -S -B -m unittest discover -s v2/compat/tests -v
      - name: Mocked provider metadata probe safety
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/tests -v
      - name: Release evidence policy regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s acceptance -p 'test_release_readiness.py' -v
      - name: Candidate assembly and Docker policy regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s packaging/candidate/tests -v
          python3 -m unittest discover -s packaging/docker/tests -v
          node --check acceptance/browser/execution-scenarios.mjs
      - name: Inert migration and independent quarantine regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s migration/tests -v
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B -m unittest discover -s "$PWD/migration/tests" -p test_service_client.py -v
          python3 acceptance/migration_quarantine_replay.py --checkout .. --revision "$(git rev-parse HEAD)"
      - name: Protected beta configuration custody regressions
        run: |
          cargo +1.99.1 test --locked -p orkestr-v2-server --lib --no-run --message-format=json > "$RUNNER_TEMP/beta-custody-artifacts.jsonl"
          sudo /usr/bin/python3 -I -S -B - "$RUNNER_TEMP/beta-custody-artifacts.jsonl" <<'PY'
          import json, subprocess, sys
          artifacts = [json.loads(line) for line in open(sys.argv[1])]
          binaries = {a['executable'] for a in artifacts if a.get('reason') == 'compiler-artifact'
                      and a.get('profile', {}).get('test') and a.get('executable')
                      and a.get('target', {}).get('kind') == ['lib']
                      and a.get('target', {}).get('name') == 'orkestr_v2_server'}
          assert len(binaries) == 1, 'one exact server test executable required'
          binary = binaries.pop()
          subprocess.run([binary, 'beta_config::loading::tests::', '--include-ignored'], check=True, timeout=300)
          subprocess.run([binary, 'deploy_maintenance::tests::', '--include-ignored'], check=True, timeout=60)
          PY
      - name: Offline domain demo smoke check
        run: cargo +1.99.1 run --locked -p orkestr-v2-demo

  http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate candidate data and build output
        run: |
          echo "ORKESTR_V2_HOME=$RUNNER_TEMP/orkestr-v2-intake" >> "$GITHUB_ENV"
          # Outside the checkout, at a fixed path relative to it so rust-cache can save it.
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/orkestr-v2-target" >> "$GITHUB_ENV"
      - name: Install namespace test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor
      - name: Qualify hosted-runner lifetime namespace policy
        run: |
          python3 -B -m unittest discover -s tests -p test_ci_lifetime_namespace.py -v
          python3 tests/ci_lifetime_namespace.py
      - name: Probe unprivileged provider lifetime namespaces
        run: python3 tests/probe_lifetime_namespaces.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: v2 -> ../../orkestr-v2-target
          # Only the integration branch saves; PRs restore its dependency build.
          save-if: ${{ github.ref == 'refs/heads/v2/rust-rewrite' }}
      - name: Locked build
        run: cargo +1.99.1 build --locked --workspace
      - name: Privileged password recovery over actual local socket and Core
        run: |
          version=$(python3 -I -S -B -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          ORKESTR_V2_BUILD_IDENTITY="ORKESTR_V2_BUILD_IDENTITY_V1|server|$version|$(git rev-parse HEAD)|END" cargo +1.99.1 build --locked -p orkestr-v2-server
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B tests/operator_password_recovery_http.py --server "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source-commit "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-password-recovery.json"
      - name: Persistent Root maintenance over actual HTTP and restart
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B tests/maintenance_restart_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source-commit "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-maintenance-restart.json"
      - name: Shared Fast, Deep and Worker windows over real HTTP
        run: |
          sudo /usr/bin/python3 -B tests/service_roles_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-service-roles.json"
      - name: Abandoned Fast preserves the original Root-managed Deep
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B tests/identity_split_fast_abandonment_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --expected-source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-fast-abandonment.json"
      - name: Default single-agent fresh and resumed windows for both providers
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B tests/identity_split_single_agent_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --provider codex --report "$RUNNER_TEMP/v2-single-agent-codex.json"
          sudo env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B tests/identity_split_single_agent_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --provider claude --report "$RUNNER_TEMP/v2-single-agent-claude.json"
      - name: Owner auto-accept of Deep, Worker and Fast without a browser session over real HTTP
        run: |
          sudo /usr/bin/python3 -B tests/service_auto_accept_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-auto-accept.json"
      - name: Claude Deep in execution windows over real HTTP (synthetic native)
        run: |
          sudo /usr/bin/python3 -B tests/service_claude_window_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-claude-window.json"
          sudo /usr/bin/python3 -B tests/service_claude_window_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-claude-window-fast-lost.json" --scenario fast-lost
          sudo /usr/bin/python3 -B tests/service_claude_window_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-claude-window-policy.json" --scenario policy
      - name: V1 thread history move and rollback over real HTTP
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B acceptance/thread_history_e2e.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server"
      - name: Stranded window restart reconciliation over real HTTP
        run: |
          sudo /usr/bin/python3 -B tests/stranded_window_http.py "$CARGO_TARGET_DIR/debug/orkestr-v2-server" --source "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/v2-stranded-window.json"
      - name: Make shared-window synthetic evidence readable
        if: ${{ always() }}
        run: |
          # The root fixture keeps reports private; transfer only this fixed CI artifact.
          if [ -f "$RUNNER_TEMP/v2-service-roles.json" ]; then
            sudo chown --no-dereference -- "$(id -u):$(id -g)" "$RUNNER_TEMP/v2-service-roles.json"
          fi
          if [ -f "$RUNNER_TEMP/v2-maintenance-restart.json" ]; then
            sudo chown --no-dereference -- "$(id -u):$(id -g)" "$RUNNER_TEMP/v2-maintenance-restart.json"
          fi
          if [ -f "$RUNNER_TEMP/v2-password-recovery.json" ]; then
            sudo chown --no-dereference -- "$(id -u):$(id -g)" "$RUNNER_TEMP/v2-password-recovery.json"
          fi
          if [ -f "$RUNNER_TEMP/v2-fast-abandonment.json" ]; then
            sudo chown --no-dereference -- "$(id -u):$(id -g)" "$RUNNER_TEMP/v2-fast-abandonment.json"
          fi
          for report in "$RUNNER_TEMP/v2-single-agent-codex.json" "$RUNNER_TEMP/v2-single-agent-claude.json"; do
            if [ -f "$report" ]; then
              sudo chown --no-dereference -- "$(id -u):$(id -g)" "$report"
            fi
          done
      - name: Retain synthetic HTTP evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-evidence-http-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit report files only: never upload the candidate home or databases.
          path: |
            ${{ runner.temp }}/v2-service-roles.json
            ${{ runner.temp }}/v2-password-recovery.json
            ${{ runner.temp }}/v2-maintenance-restart.json
            ${{ runner.temp }}/v2-fast-abandonment.json
            ${{ runner.temp }}/v2-single-agent-codex.json
            ${{ runner.temp }}/v2-single-agent-claude.json
          if-no-files-found: ignore
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    # Process-failure tests exercise real deadlines; allow every shard to finish.
    timeout-minutes: 45
    strategy:
      # A failing shard must not hide what the others would have reported.
      fail-fast: false
      matrix:
        # Two shards go to the two store property tests, which need a runner
        # each: together in one process they took twelve minutes, apart four.
        # The rest is balanced over the others by tests/ci_test_weights.json.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate candidate data and build output
        run: |
          echo "ORKESTR_V2_HOME=$RUNNER_TEMP/orkestr-v2-intake" >> "$GITHUB_ENV"
          # Some tests create only their own directory inside the candidate home and
          # relied on a test that ran earlier in the single job to have created the home.
          mkdir -p "$RUNNER_TEMP/orkestr-v2-intake"
          # Outside the checkout, at a fixed path relative to it so rust-cache can save it.
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/orkestr-v2-target" >> "$GITHUB_ENV"
      - name: Install namespace test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor
      - name: Qualify hosted-runner lifetime namespace policy
        run: |
          python3 -B -m unittest discover -s tests -p test_ci_lifetime_namespace.py -v
          python3 tests/ci_lifetime_namespace.py
      - name: Probe unprivileged provider lifetime namespaces
        run: python3 tests/probe_lifetime_namespaces.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: v2 -> ../../orkestr-v2-target
          shared-key: rust-v2
          # Only the integration branch saves, from one shard; every shard builds the same set.
          save-if: ${{ github.ref == 'refs/heads/v2/rust-rewrite' && matrix.shard == 3 }}
      - name: Build the workspace tests
        run: cargo +1.99.1 test --locked --workspace --no-run
      - name: Select this shard's tests
        run: >
          python3 tests/ci_test_shards.py plan --shards ${{ strategy.job-total }} --index ${{ matrix.shard }}
          --weights tests/ci_test_weights.json
          --out "$RUNNER_TEMP/v2-evidence/shards/plan-${{ matrix.shard }}.json"
          -- cargo +1.99.1 test --locked --workspace
      - name: Unit and HTTP process-failure tests (requires Python 3)
        run: >
          python3 tests/ci_test_shards.py run
          --plan "$RUNNER_TEMP/v2-evidence/shards/plan-${{ matrix.shard }}.json"
          -- cargo +1.99.1 test --locked --workspace
      - name: Stage synthetic worker lifecycle evidence
        if: ${{ always() }}
        run: |
          # Explicit report files only: never upload the candidate home or databases.
          mkdir -p "$RUNNER_TEMP/v2-evidence/orkestr-v2-intake"
          if [ -d "$ORKESTR_V2_HOME" ]; then
            find "$ORKESTR_V2_HOME" -maxdepth 1 -type f \( -name 'worker-retirement-*.json' -o -name 'worker-continuation-*.json' \) \
              -exec cp -- {} "$RUNNER_TEMP/v2-evidence/orkestr-v2-intake/" \;
          fi
      - name: Retain shard plan and worker lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-evidence-unit-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-evidence
          if-no-files-found: ignore
          retention-days: 7

  rust-v2:
    # Runs even when a part failed, so the check reports failure instead of "skipped".
    if: ${{ always() }}
    needs: [lint, service, http, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Collect the evidence of every part
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: v2-evidence-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/v2-evidence
          merge-multiple: true
      - name: Retain synthetic worker lifecycle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-worker-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Require every part of the suite
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, service, http, unit: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
      - name: Prove the workspace tests were split without gaps or repeats
        run: python3 v2/tests/ci_test_shards.py verify "$RUNNER_TEMP"/v2-evidence/shards/plan-*.json

  cargo-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PR content cannot supply its own scanner or exception policy.
      POLICY_REF: ${{ github.event.pull_request.base.sha || github.sha }}
      TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
      evidence-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_COMMIT }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.POLICY_REF }}
          path: policy
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Exact Cargo.lock advisory scan (no cargo, no install)
        run: |
          scanner="$GITHUB_WORKSPACE/policy"
          policy_commit="$POLICY_REF"
          # A base that predates this gate has no scanner to offer; only then does the candidate's own copy run.
          if [ ! -f "$scanner/scripts/security/cargo-advisories.mjs" ]; then
            echo "::notice::The base commit has no Cargo advisory scanner yet; using the candidate's copy."
            scanner="$GITHUB_WORKSPACE/candidate"
            policy_commit="$TARGET_COMMIT"
          fi
          node "$scanner/scripts/security/cargo-advisories.mjs" \
            --root "$GITHUB_WORKSPACE/candidate" --commit "$TARGET_COMMIT" \
            --policy-commit "$policy_commit" --report "$RUNNER_TEMP/cargo-advisory-evidence.json"
      - name: Publish minimized aggregate evidence
        if: ${{ always() }}
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-advisory-evidence
          path: ${{ runner.temp }}/cargo-advisory-evidence.json
          if-no-files-found: error
          retention-days: 14

  cargo-policy:
    # Stable required-check name for the ORK-478 ruleset; skipped is not success.
    if: ${{ always() && !cancelled() }}
    needs: cargo-advisories
    runs-on: ubuntu-latest
    steps:
      - name: Require complete scan and published evidence
        env:
          RESULT: ${{ needs.cargo-advisories.result }}
          EVIDENCE_ID: ${{ needs.cargo-advisories.outputs.evidence-id }}
          EVIDENCE_DIGEST: ${{ needs.cargo-advisories.outputs.evidence-digest }}
        run: |
          test "$RESULT" = success
          test -n "$EVIDENCE_ID"
          test -n "$EVIDENCE_DIGEST"
