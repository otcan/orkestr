name: Orkestr 2.0 Rust prototype

on:
  push:
    branches:
      - v2/rust-rewrite
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust with lint and formatter
        run: |
          rustup show active-toolchain
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Smoke CLI
        run: cargo run --locked -p orkestr-v2-demo
