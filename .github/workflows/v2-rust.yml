name: Orkestr 2.0 Rust prototype

on:
  push:
    branches:
      - v2/rust-rewrite
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust with lint and formatter
        run: |
          rustup show active-toolchain
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Smoke CLI
        run: cargo run --locked -p orkestr-v2-demo
      - name: Durable CLI reopen
        run: |
          demo_dir=$(mktemp -d)
          cargo run --locked -p orkestr-v2-store-sqlite --example durable -- "$demo_dir/demo.sqlite"
          cargo run --locked -p orkestr-v2-store-sqlite --example durable -- "$demo_dir/demo.sqlite"
      - name: Isolated UI fixture tests
        run: |
          cargo fmt --manifest-path spikes/dioxus-ui/Cargo.toml --all -- --check
          cargo clippy --manifest-path spikes/dioxus-ui/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path spikes/dioxus-ui/Cargo.toml --locked
      - name: UI WASM compatibility
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --manifest-path spikes/dioxus-ui/Cargo.toml --locked --target wasm32-unknown-unknown --features web -- -D warnings
