name: Orkestr 2.0 Rust prototype

on:
  push:
    branches:
      - v2/rust-rewrite
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with lint and formatter
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
      - name: Rust format
        run: cargo +stable fmt --all -- --check
      - name: Rust lint
        run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --workspace
      - name: Smoke CLI
        run: cargo +stable run -p orkestr-v2-demo
