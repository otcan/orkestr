name: V2 public-source Linux image
on:
  pull_request:
    branches: [integration, 'v2/**']
    paths: ['v2/**', '.github/workflows/v2-image.yml']
  push:
    branches: [integration, v2/rust-rewrite, 'ci/image-cache/**']
    paths: ['v2/**', '.github/workflows/v2-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux-image-amd64:
    # Native builds only (no QEMU); runners stay literal for the workflow policy.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create an empty anonymous Docker configuration
        run: |
          mkdir "$RUNNER_TEMP/empty-docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/empty-docker-config" >> "$GITHUB_ENV"
      - name: Set up the isolated native BuildKit builder
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver: docker-container
          buildkitd-flags: --debug=false
          cache-binary: false
      - name: Runner architecture is native amd64
        run: |
          test "$(docker info --format '{{.Architecture}}')" = x86_64
      - name: Failure-oriented bootstrap checks
        run: python3 -I -S -B -m unittest discover -s v2/packaging/oss/tests -v
      - name: Reserve this architecture's share of measured free cache space
        id: cache-allowance
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B v2/packaging/oss/cache_budget.py \
            --prepare --report "$RUNNER_TEMP/cache-allowance.json"
      - name: Sample build CPU and memory counters
        run: |
          python3 -I -S -B v2/packaging/oss/image_metrics.py \
            --output "$RUNNER_TEMP/image-metrics.jsonl" --stop "$RUNNER_TEMP/image-metrics.stop" \
            > "$RUNNER_TEMP/image-metrics.log" 2>&1 < /dev/null &
      - name: Import shared tooling for mandatory cache probes (PRs read only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: v2/packaging/oss/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_JOBS=4
          push: false
          target: tooling
          cache-from: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},timeout=2m
      - name: Verify fail-fast gates and cross-source tooling reuse
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OTHER_SOURCE=$(git cat-file -p "$SOURCE" | awk '$1 == "parent" { print $2; exit }')
          python3 -I -S -B v2/packaging/oss/cache_boundaries.py \
            --source "$SOURCE" --other-source "$OTHER_SOURCE" --jobs 4 \
            --report "$RUNNER_TEMP/cache-boundaries.json"
      - name: Build only from anonymous public source (no push)
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: v2/packaging/oss/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_JOBS=4
          push: false
          target: runtime
          load: true
          tags: orkestr-v2:fresh
          cache-from: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},timeout=2m
      - name: Export the paired candidate bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: v2/packaging/oss/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_JOBS=4
          push: false
          target: bundle
          outputs: type=local,dest=${{ runner.temp }}/bundle
          cache-from: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},timeout=2m
      - name: Everyday Compose commands need no exported commit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          compose="docker compose -f v2/packaging/oss/compose.yaml"
          env -u ORKESTR_SOURCE_COMMIT $compose config --quiet
          printf 'ORKESTR_SOURCE_COMMIT=%s\n' "$SOURCE" > v2/packaging/oss/.env
          env -u ORKESTR_SOURCE_COMMIT $compose config | grep -q "SOURCE_COMMIT: $SOURCE"
          rm v2/packaging/oss/.env
          if env -u ORKESTR_SOURCE_COMMIT $compose build > "$RUNNER_TEMP/no-commit.log" 2>&1; then
            echo 'a build without the exact commit was accepted' >&2; exit 1
          fi
          grep -q 'SOURCE_COMMIT must be the exact 40-character public commit' "$RUNNER_TEMP/no-commit.log"
      - name: Fresh install through provider login required
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py \
            --image orkestr-v2:fresh --source "$SOURCE" --report "$RUNNER_TEMP/fresh-install.json"
      - name: Local first-run account needs only a username and password
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py --local-setup \
            --image orkestr-v2:fresh --source "$SOURCE" --report "$RUNNER_TEMP/local-fresh-install.json"
      - name: Export the tested Docker image for local owner acceptance
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/test-image"
          docker tag orkestr-v2:fresh "orkestr-oss-test:$SOURCE"
          docker save "orkestr-oss-test:$SOURCE" | gzip -1 > "$RUNNER_TEMP/test-image/orkestr-oss-test-amd64.tar.gz"
          cd "$RUNNER_TEMP/test-image"
          sha256sum orkestr-oss-test-amd64.tar.gz > orkestr-oss-test-amd64.tar.gz.sha256
          sha256sum -c orkestr-oss-test-amd64.tar.gz.sha256
      - name: Retain the Docker image for download (no registry publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-test-image-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/test-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preview the compressed cache within the free storage allowance
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: v2/packaging/oss/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_JOBS=4
          push: false
          target: runtime
          cache-from: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},timeout=2m
          cache-to: type=local,dest=${{ runner.temp }}/cache-preview,mode=max
      - name: Admit cache export within the measured free allowance
        id: cache-budget
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ALLOWANCE: ${{ steps.cache-allowance.outputs.bytes }}
        run: |
          python3 -I -S -B v2/packaging/oss/cache_budget.py \
            --allocation "${CACHE_ALLOWANCE:-0}" --preview "$RUNNER_TEMP/cache-preview" --report "$RUNNER_TEMP/cache-budget.json"
      - name: Publish trusted-branch cache only (never PR results)
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cache-budget.outputs.allowed == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: v2/packaging/oss/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_JOBS=4
          push: false
          target: runtime
          cache-from: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},timeout=2m
          cache-to: type=gha,version=2,scope=v2-image-v1-amd64-${{ hashFiles('v2/packaging/oss/Dockerfile', 'v2/rust-toolchain.toml', 'v2/Cargo.lock', 'package-lock.json') }},mode=max,timeout=5m,ignore-error=true
      - name: Finish resource sampling
        if: always()
        run: |
          touch "$RUNNER_TEMP/image-metrics.stop"
          sleep 3
      - name: Retain synthetic acceptance evidence and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-linux-amd64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-install.json
            ${{ runner.temp }}/local-fresh-install.json
            ${{ runner.temp }}/bundle/*.tar.gz
            ${{ runner.temp }}/bundle/SHA256SUMS
            ${{ runner.temp }}/bundle/paired-artifacts.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain build diagnostics separately from the candidate contract
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-linux-amd64-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cache-boundaries*
            ${{ runner.temp }}/cache-budget.json
            ${{ runner.temp }}/cache-allowance.json
            ${{ runner.temp }}/image-metrics*
          if-no-files-found: ignore
          retention-days: 7
  linux-image-arm64:
    # Native builds only (no QEMU); runners stay literal for the workflow policy.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
