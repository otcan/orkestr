name: V2 public-source Linux image
on:
  pull_request:
    branches: ['v2/**']
    paths: ['v2/**', '.github/workflows/v2-image.yml']
  push:
    branches: [v2/rust-rewrite]
    paths: ['v2/**', '.github/workflows/v2-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux-image-amd64:
    # Native builds only (no QEMU); runners stay literal for the workflow policy.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner architecture is native amd64
        run: |
          test "$(docker info --format '{{.Architecture}}')" = x86_64
      - name: Failure-oriented bootstrap checks
        run: python3 -I -S -B -m unittest discover -s v2/packaging/oss/tests -v
      - name: Build only from anonymous public source (no push)
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker build --progress=plain --build-arg SOURCE_COMMIT="$SOURCE" \
            --tag orkestr-v2:fresh --file v2/packaging/oss/Dockerfile .
          docker build --build-arg SOURCE_COMMIT="$SOURCE" --target bundle \
            --output "type=local,dest=$RUNNER_TEMP/bundle" --file v2/packaging/oss/Dockerfile .
      - name: Everyday Compose commands need no exported commit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          compose="docker compose -f v2/packaging/oss/compose.yaml"
          env -u ORKESTR_SOURCE_COMMIT $compose config --quiet
          printf 'ORKESTR_SOURCE_COMMIT=%s\n' "$SOURCE" > v2/packaging/oss/.env
          env -u ORKESTR_SOURCE_COMMIT $compose config | grep -q "SOURCE_COMMIT: $SOURCE"
          rm v2/packaging/oss/.env
          if env -u ORKESTR_SOURCE_COMMIT $compose build > "$RUNNER_TEMP/no-commit.log" 2>&1; then
            echo 'a build without the exact commit was accepted' >&2; exit 1
          fi
          grep -q 'SOURCE_COMMIT must be the exact 40-character public commit' "$RUNNER_TEMP/no-commit.log"
      - name: Fresh install through provider login required
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py \
            --image orkestr-v2:fresh --source "$SOURCE" --report "$RUNNER_TEMP/fresh-install.json"
      - name: Retain synthetic acceptance evidence and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-linux-amd64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-install.json
            ${{ runner.temp }}/bundle/*.tar.gz
            ${{ runner.temp }}/bundle/SHA256SUMS
            ${{ runner.temp }}/bundle/paired-artifacts.json
          if-no-files-found: ignore
          retention-days: 7
  linux-image-arm64:
    # Native builds only (no QEMU); runners stay literal for the workflow policy.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner architecture is native arm64
        run: |
          test "$(docker info --format '{{.Architecture}}')" = aarch64
      - name: Failure-oriented bootstrap checks
        run: python3 -I -S -B -m unittest discover -s v2/packaging/oss/tests -v
      - name: Build only from anonymous public source (no push)
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker build --progress=plain --build-arg SOURCE_COMMIT="$SOURCE" \
            --tag orkestr-v2:fresh --file v2/packaging/oss/Dockerfile .
          docker build --build-arg SOURCE_COMMIT="$SOURCE" --target bundle \
            --output "type=local,dest=$RUNNER_TEMP/bundle" --file v2/packaging/oss/Dockerfile .
      - name: Everyday Compose commands need no exported commit
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          compose="docker compose -f v2/packaging/oss/compose.yaml"
          env -u ORKESTR_SOURCE_COMMIT $compose config --quiet
          printf 'ORKESTR_SOURCE_COMMIT=%s\n' "$SOURCE" > v2/packaging/oss/.env
          env -u ORKESTR_SOURCE_COMMIT $compose config | grep -q "SOURCE_COMMIT: $SOURCE"
          rm v2/packaging/oss/.env
          if env -u ORKESTR_SOURCE_COMMIT $compose build > "$RUNNER_TEMP/no-commit.log" 2>&1; then
            echo 'a build without the exact commit was accepted' >&2; exit 1
          fi
          grep -q 'SOURCE_COMMIT must be the exact 40-character public commit' "$RUNNER_TEMP/no-commit.log"
      - name: Fresh install through provider login required
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py \
            --image orkestr-v2:fresh --source "$SOURCE" --report "$RUNNER_TEMP/fresh-install.json"
      - name: Retain synthetic acceptance evidence and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-linux-arm64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-install.json
            ${{ runner.temp }}/bundle/*.tar.gz
            ${{ runner.temp }}/bundle/SHA256SUMS
            ${{ runner.temp }}/bundle/paired-artifacts.json
          if-no-files-found: ignore
          retention-days: 7
