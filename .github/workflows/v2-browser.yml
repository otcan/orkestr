name: V2 CI headless rendering
on:
  push:
    branches: ['v2/rust-rewrite']
    paths: ['v2/**', '.github/workflows/v2-browser.yml', 'package-lock.json']
  pull_request:
    branches: ['v2/**']
    paths: ['v2/**', '.github/workflows/v2-browser.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
# Only superseded PR checks cancel; manual and integration push runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headless-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare isolated build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
          echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/v2-target" >> "$GITHUB_ENV"
          echo "UI_BUNDLE_DIR=$RUNNER_TEMP/v2-bundle" >> "$GITHUB_ENV"
          echo "V2_SERVER=$(dirname "$GITHUB_WORKSPACE")/v2-target/debug/orkestr-v2-server" >> "$GITHUB_ENV"
          echo "V2_CARGO=$RUNNER_TEMP/v2-cargo" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nexec cargo +1.99.1 "$@"\n' > "$RUNNER_TEMP/v2-cargo"
          chmod +x "$RUNNER_TEMP/v2-cargo"
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: v2 -> ../../v2-target
          cache-directories: ${{ runner.temp }}/bindgen
          save-if: ${{ github.ref == 'refs/heads/v2/rust-rewrite' }}
      - name: Install wasm-bindgen CLI
        run: |
          if ! "$RUNNER_TEMP/bindgen/bin/wasm-bindgen" --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.129'; then
            cargo +1.99.1 install wasm-bindgen-cli --version 0.2.129 --locked --root "$RUNNER_TEMP/bindgen"
          fi
          echo "$RUNNER_TEMP/bindgen/bin" >> "$GITHUB_PATH"
      - name: Install locked browser dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npx --no-install puppeteer browsers install chrome
      - name: Build actual server and release bundle
        working-directory: v2
        run: |
          cargo +1.99.1 fetch --locked
          cargo +1.99.1 build --offline --locked -p orkestr-v2-server
          bash apps/ui/scripts/bundle.sh
      - name: Browser tracker recovery and request boundary unit tests
        run: node --test v2/apps/ui/tests/tracker_client.test.mjs v2/apps/ui/tests/selected_conversation.test.mjs v2/apps/ui/tests/request.test.mjs v2/apps/ui/tests/local_setup.test.mjs
      - name: Local account first-run form and existing-owner sign-in
        run: node v2/ci/headless-local-account.mjs
      - name: CI headless rendering with synthetic data
        run: node v2/ci/headless-rendering.mjs
      - name: CI configured workspace rendering against a synthetic API
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/v2-screenshots
        run: node v2/ci/headless-workspace.mjs
      - name: Retain synthetic desktop and phone screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
