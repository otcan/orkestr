name: V2 beta image publish
# Publishes the prebuilt multi-arch V2 beta image to GHCR, only for pushed V2
# beta tags (v2.0.0-beta.N, or v2.0.0-beta.N-rc.M candidates). Never main,
# never V1 v0.* tags, never a floating tag: the root ci.yml V1 image owns those
# in the same package. Unprivileged jobs build and smoke-test natively per
# architecture; the token-holding job only loads, tags and pushes those
# artifacts (workflow-policy.mjs enforces this shape and the tag set).
on:
  push:
    tags: ['v2.0.0-beta.*']
permissions:
  contents: read
concurrency:
  group: v2-publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Exact V2 tags only (refuses floating, main and V1 tags)
        run: |
          set -euo pipefail
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          version=$(python3 -I -S -B -c "import tomllib;print(tomllib.load(open('v2/Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 -I -S -B v2/packaging/oss/publish_tags.py "$GITHUB_REF_NAME" "$version"
          python3 -I -S -B -m unittest discover -s v2/packaging/oss/tests -v
      - name: Build from the anonymous public tag commit
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker build --progress=plain --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/otcan/orkestr \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$GITHUB_REF_NAME" \
            --tag orkestr-v2:amd64 --file v2/packaging/oss/Dockerfile .
      - name: Fresh install with the one-command docker run flags
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py \
            --image orkestr-v2:amd64 --source "$GITHUB_SHA" --report "$RUNNER_TEMP/image/fresh-install-amd64.json"
          python3 -I -S -B v2/packaging/oss/fresh_install.py --local-setup \
            --image orkestr-v2:amd64 --source "$GITHUB_SHA" --report "$RUNNER_TEMP/image/local-fresh-install-amd64.json"
      - name: Export the tested image
        run: |
          set -euo pipefail
          docker save orkestr-v2:amd64 | gzip > "$RUNNER_TEMP/image/orkestr-v2-amd64.tar.gz"
          (cd "$RUNNER_TEMP/image" && sha256sum orkestr-v2-amd64.tar.gz > orkestr-v2-amd64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-image-amd64
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 30
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Exact V2 tags only (refuses floating, main and V1 tags)
        run: |
          set -euo pipefail
          test "$(docker info --format '{{.Architecture}}')" = aarch64
          version=$(python3 -I -S -B -c "import tomllib;print(tomllib.load(open('v2/Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 -I -S -B v2/packaging/oss/publish_tags.py "$GITHUB_REF_NAME" "$version"
          python3 -I -S -B -m unittest discover -s v2/packaging/oss/tests -v
      - name: Build from the anonymous public tag commit
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker build --progress=plain --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/otcan/orkestr \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$GITHUB_REF_NAME" \
            --tag orkestr-v2:arm64 --file v2/packaging/oss/Dockerfile .
      - name: Fresh install with the one-command docker run flags
        run: |
          python3 -I -S -B v2/packaging/oss/fresh_install.py \
            --image orkestr-v2:arm64 --source "$GITHUB_SHA" --report "$RUNNER_TEMP/image/fresh-install-arm64.json"
          python3 -I -S -B v2/packaging/oss/fresh_install.py --local-setup \
            --image orkestr-v2:arm64 --source "$GITHUB_SHA" --report "$RUNNER_TEMP/image/local-fresh-install-arm64.json"
      - name: Export the tested image
        run: |
          set -euo pipefail
          docker save orkestr-v2:arm64 | gzip > "$RUNNER_TEMP/image/orkestr-v2-arm64.tar.gz"
          (cd "$RUNNER_TEMP/image" && sha256sum orkestr-v2-arm64.tar.gz > orkestr-v2-arm64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-image-arm64
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 30
  provenance:
    # Build provenance for the exact tested image archives (gh attestation verify).
    needs: [image-amd64, image-arm64]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: v2-image-*
          path: ${{ runner.temp }}/image
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/image/orkestr-v2-*.tar.gz
  image-publish:
    needs: [image-amd64, image-arm64, provenance]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.0.0-beta.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v2-image-amd64
          path: ${{ runner.temp }}/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v2-image-arm64
          path: ${{ runner.temp }}/arm64
      - name: Load the tested images
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/amd64/orkestr-v2-amd64.tar.gz"
          docker load --input "$RUNNER_TEMP/arm64/orkestr-v2-arm64.tar.gz"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push per-architecture tags and one multi-arch tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v2\.0\.0-beta\.[0-9]+(-rc\.[0-9]+)?$ ]]
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag orkestr-v2:amd64 "$IMAGE:$GITHUB_REF_NAME-amd64"
          docker tag orkestr-v2:arm64 "$IMAGE:$GITHUB_REF_NAME-arm64"
          docker push "$IMAGE:$GITHUB_REF_NAME-amd64"
          docker push "$IMAGE:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:$GITHUB_REF_NAME-amd64" "$IMAGE:$GITHUB_REF_NAME-arm64"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
  pulled-amd64:
    # Self-check of the published tag: anonymous pull, then the fresh install.
    needs: image-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Anonymous pull of the published multi-arch tag, then fresh install
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker pull "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME"
          test "$(docker image inspect --format '{{.Architecture}}' "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME")" = amd64
          python3 -I -S -B v2/packaging/oss/fresh_install.py --image "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME" \
            --source "$GITHUB_SHA" --report "$RUNNER_TEMP/pulled/fresh-install-amd64.json"
          python3 -I -S -B v2/packaging/oss/fresh_install.py --local-setup --image "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME" \
            --source "$GITHUB_SHA" --report "$RUNNER_TEMP/pulled/local-fresh-install-amd64.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v2-pulled-amd64
          path: ${{ runner.temp }}/pulled/
          if-no-files-found: ignore
          retention-days: 30
  pulled-arm64:
    needs: image-publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Anonymous pull of the published multi-arch tag, then fresh install
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          docker pull "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME"
          test "$(docker image inspect --format '{{.Architecture}}' "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME")" = arm64
          python3 -I -S -B v2/packaging/oss/fresh_install.py --image "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME" \
            --source "$GITHUB_SHA" --report "$RUNNER_TEMP/pulled/fresh-install-arm64.json"
          python3 -I -S -B v2/packaging/oss/fresh_install.py --local-setup --image "ghcr.io/otcan/orkestr:$GITHUB_REF_NAME" \
            --source "$GITHUB_SHA" --report "$RUNNER_TEMP/pulled/local-fresh-install-arm64.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v2-pulled-arm64
          path: ${{ runner.temp }}/pulled/
          if-no-files-found: ignore
          retention-days: 30
