name: CI

on:
  workflow_dispatch:
  pull_request:
    # ready_for_review starts the full run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [integration]
    tags: ['v*']
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

# A newer run replaces an older one for the same PR, and a newer push to
# integration replaces the older integration run. Tags, merge groups, schedules
# and manual runs keep a unique group and are never cancelled.
# PR numbers also keep identically named branches from different forks separate.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && github.ref == 'refs/heads/integration' && format('push-{0}', github.ref)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/integration') }}

jobs:
  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PR/merge-queue content cannot supply its own scanner or exception policy.
      POLICY_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
      evidence-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.POLICY_REF }}
          path: policy
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Exact lockfile advisory and provenance scan (no install)
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: >-
          node policy/scripts/security/dependency-advisories.mjs
          --root "$GITHUB_WORKSPACE/candidate" --commit "$TARGET_COMMIT"
          --policy-commit "$POLICY_REF" --report "$RUNNER_TEMP/dependency-evidence.json"
      - name: Publish minimized aggregate evidence
        if: ${{ always() }}
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-evidence
          path: ${{ runner.temp }}/dependency-evidence.json
          if-no-files-found: error
          retention-days: 14

  dependency-policy:
    # Stable required-check name for the ORK-478 ruleset; skipped is not success.
    if: ${{ always() && !cancelled() }}
    needs: dependency-advisories
    runs-on: ubuntu-latest
    steps:
      - name: Require complete scan and published evidence
        env:
          RESULT: ${{ needs.dependency-advisories.result }}
          EVIDENCE_ID: ${{ needs.dependency-advisories.outputs.evidence-id }}
          EVIDENCE_DIGEST: ${{ needs.dependency-advisories.outputs.evidence-digest }}
        run: |
          test "$RESULT" = success
          test -n "$EVIDENCE_ID"
          test -n "$EVIDENCE_DIGEST"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SCAN_COMMIT: ${{ github.sha }}
      POLICY_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
      evidence-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.POLICY_REF }}
          path: .secret-policy
          persist-credentials: false
      - name: Pinned redacted secret scan
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          # Exact v8.30.1 asset; the existing digest below remains authoritative.
          curl --fail --silent --show-error --location --max-time 60 --retry 2 --retry-delay 2 --retry-max-time 180 --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 -o "$scan_dir/release.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$scan_dir/release.tar.gz" | sha256sum --check --status
          tar -xzf "$scan_dir/release.tar.gz" -C "$scan_dir" gitleaks
          ORKESTR_TEST_GITLEAKS_BINARY="$scan_dir/gitleaks" node --test test/gitleaks-reviewed-digest.test.js test/secret-scan-coverage.test.js
          scan_args=(--binary "$scan_dir/gitleaks" --repository "$GITHUB_WORKSPACE" --label "$GITHUB_REPOSITORY" --report "$RUNNER_TEMP/secret-evidence.json" --target-ref HEAD --expected-commit "$SCAN_COMMIT")
          if [[ "$SCAN_BASE" =~ ^[a-f0-9]{40}$ && "$SCAN_BASE" != "0000000000000000000000000000000000000000" ]]; then
            scan_args+=(--base "$SCAN_BASE")
          fi
          node .secret-policy/scripts/security/secret-scan.mjs "${scan_args[@]}"
      - name: Publish aggregate-only secret scan evidence
        if: ${{ always() }}
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-evidence
          path: ${{ runner.temp }}/secret-evidence.json
          if-no-files-found: error
          retention-days: 14

  secret-policy:
    if: ${{ always() && !cancelled() }}
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require complete scan and published evidence
        env:
          RESULT: ${{ needs.secret-scan.result }}
          EVIDENCE_ID: ${{ needs.secret-scan.outputs.evidence-id }}
          EVIDENCE_DIGEST: ${{ needs.secret-scan.outputs.evidence-digest }}
        run: |
          test "$RESULT" = success
          test -n "$EVIDENCE_ID"
          test -n "$EVIDENCE_DIGEST"

  syntax:
    runs-on: ubuntu-latest
    env:
      ORKESTR_BROWSER_LAUNCH_DISABLED: "1"
      ORKESTR_RECOVER_RUNNING_ON_START: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          find apps packages scripts examples -path '*/node_modules/*' -prune -o \( -name '*.js' -o -name '*.mjs' \) -print |
            while read -r file; do node --check "$file"; done
      - name: OSS boundary and fixture secret check
        run: node scripts/oss-boundary-check.mjs

  changes:
    # Says whether a pull request changes only documentation: files under docs/
    # and Markdown files. Every other event reports false. Heavy jobs skip only
    # on an explicit "true", so a failure here never skips them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          # Commits and trees only: listing changed paths reads no file contents.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            # Same file set as the PR's "Files changed" tab: merge base to head.
            if changed=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
              printf '%s\n' "$changed"
              other=$(printf '%s\n' "$changed" | grep -Ev '^docs/|\.md$' || true)
              if [ -n "$changed" ] && [ -z "$other" ]; then docs_only=true; fi
            else
              echo "::warning::Could not list the changed files; running the full suite."
            fi
          fi
          echo "docs-only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: [dependency-policy, changes]
    # Heavy: not run by the nightly scan, for draft PRs or for docs-only PRs.
    # test, smoke and provenance need build, so they skip with it.
    if: ${{ github.event_name != 'schedule' && github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    env:
      ORKESTR_BROWSER_LAUNCH_DISABLED: "1"
      ORKESTR_RECOVER_RUNNING_ON_START: "0"
    outputs:
      runtime-id: ${{ steps.runtime-artifact.outputs.artifact-id }}
      runtime-digest: ${{ steps.runtime-artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .dependency-policy
          sparse-checkout: scripts/security/dependency-*
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit
      - name: Fail on node_modules drift from package-lock.json
        run: node scripts/check-installed-deps.mjs --strict
      - run: node .dependency-policy/scripts/security/dependency-lifecycle.mjs --root . --installed
      - run: node scripts/patch-whatsapp-media-id.mjs
      - name: Build
        run: npm run security:workflows && npm run build
      - name: Runtime content manifest
        run: node scripts/release-provenance/content-manifest.mjs --root dist --label dist --output "$RUNNER_TEMP/runtime-dist-manifest.json"
      - id: runtime-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-dist
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-dist-manifest
          path: ${{ runner.temp }}/runtime-dist-manifest.json
          if-no-files-found: error

  provenance:
    # Signs sidecar provenance for trusted integration/dispatch builds only. This job
    # runs no candidate npm code; it recomputes the manifest from the uploaded
    # artifact and attests the runtime-dist archive digest and the manifest.
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUNTIME_DIGEST: ${{ needs.build.outputs.runtime-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-dist
          path: ${{ runner.temp }}/runtime-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-dist-manifest
          path: ${{ runner.temp }}/ci-manifest
      - name: Verify content manifest and bind attestation subjects
        run: |
          set -euo pipefail
          # upload-artifact reports the digest as bare hex; the REST API adds a
          # sha256: prefix. Accept either and normalize to hex.
          RUNTIME_DIGEST_HEX="${RUNTIME_DIGEST#sha256:}"
          [[ "$RUNTIME_DIGEST_HEX" =~ ^[a-f0-9]{64}$ ]]
          node scripts/release-provenance/content-manifest.mjs --root "$RUNNER_TEMP/runtime-dist" --label dist \
            --output "$RUNNER_TEMP/runtime-dist-manifest.json" --expect "$RUNNER_TEMP/ci-manifest/runtime-dist-manifest.json"
          {
            printf '%s  runtime-dist.zip\n' "$RUNTIME_DIGEST_HEX"
            (cd "$RUNNER_TEMP" && sha256sum runtime-dist-manifest.json)
          } > "$RUNNER_TEMP/provenance-subjects.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/provenance-subjects.sha256

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ORKESTR_BROWSER_LAUNCH_DISABLED: "1"
      ORKESTR_RECOVER_RUNNING_ON_START: "0"
      ORKESTR_TEST_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .dependency-policy
          sparse-checkout: scripts/security/dependency-*
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit
      - name: Fail on node_modules drift from package-lock.json
        run: node scripts/check-installed-deps.mjs --strict
      - run: node .dependency-policy/scripts/security/dependency-lifecycle.mjs --root . --installed
      - run: node scripts/patch-whatsapp-media-id.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-dist
          path: dist
      - name: Test shard ${{ matrix.shard }}/4 (files in test/flaky-tests.json are retried once)
        run: npm run test:ci -- --shard ${{ matrix.shard }}/4

  tests:
    # Stable required-check name aggregating every test shard and the smoke
    # run, so branch protection does not track per-shard matrix names. Reports
    # skipped (not failed) when build is skipped on purpose: draft or docs-only PR.
    if: ${{ always() && !cancelled() && github.event_name != 'schedule' && github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    needs: [changes, build, test, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, all test shards and smoke to succeed
        env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "build=$BUILD test=$TEST smoke=$SMOKE"
          test "$BUILD" = success
          test "$TEST" = success
          test "$SMOKE" = success

  smoke:
    runs-on: ubuntu-latest
    needs: build
    env:
      ORKESTR_BROWSER_LAUNCH_DISABLED: "1"
      ORKESTR_RECOVER_RUNNING_ON_START: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .dependency-policy
          sparse-checkout: scripts/security/dependency-*
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit
      - name: Fail on node_modules drift from package-lock.json
        run: node scripts/check-installed-deps.mjs --strict
      - run: node .dependency-policy/scripts/security/dependency-lifecycle.mjs --root . --installed
      - run: node scripts/patch-whatsapp-media-id.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-dist
          path: dist
      - run: npm run smoke
      - run: npm run demo:coding-agent

  image:
    # Unprivileged: builds and smoke-tests the runtime image from the candidate
    # tree with the default read-only token, then hands it off as an artifact.
    needs: [dependency-policy, changes]
    if: ${{ github.event_name != 'schedule' && github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull --tag orkestr-ci:candidate .
      - name: Smoke runtime image
        run: |
          set -euo pipefail
          docker run --detach --name orkestr-smoke --publish 127.0.0.1:3000:3000 orkestr-ci:candidate
          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs orkestr-smoke; exit 1; fi
          docker exec orkestr-smoke orkestr --help >/dev/null
          docker stop orkestr-smoke
      - name: Export runtime image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-image"
          docker save orkestr-ci:candidate | gzip > "$RUNNER_TEMP/runtime-image/orkestr-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-image
          path: ${{ runner.temp }}/runtime-image/orkestr-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  image-arm64:
    # Same build and smoke test on a native arm64 runner (Apple Silicon Macs
    # otherwise run the amd64 image under emulation). Only for published refs
    # (not V2 tags, which publish no root image).
    needs: dependency-policy
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v2.')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build runtime image (arm64)
        run: docker build --pull --build-arg TARGETARCH=arm64 --tag orkestr-ci:candidate-arm64 .
      - name: Smoke runtime image (arm64)
        run: |
          set -euo pipefail
          docker run --detach --name orkestr-smoke --publish 127.0.0.1:3000:3000 orkestr-ci:candidate-arm64
          ok=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs orkestr-smoke; exit 1; fi
          docker exec orkestr-smoke orkestr --help >/dev/null
          docker stop orkestr-smoke
      - name: Export runtime image (arm64)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-image-arm64"
          docker save orkestr-ci:candidate-arm64 | gzip > "$RUNNER_TEMP/runtime-image-arm64/orkestr-image-arm64.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-image-arm64
          path: ${{ runner.temp }}/runtime-image-arm64/orkestr-image-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  image-publish:
    # Publishes the already-built, smoke-tested image to GHCR for trusted
    # legacy v* tags only. V2 tags (v2.*) never publish this root V1 image and
    # never move :latest; V2 betas ship their source tarball and checksums. No checkout and no npm/npx/node: this job never
    # executes candidate code; it only loads, tags and pushes the artifact.
    needs: [image, image-arm64, test, smoke, provenance, secret-policy, syntax]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v2.')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-image
          path: ${{ runner.temp }}/runtime-image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-image-arm64
          path: ${{ runner.temp }}/runtime-image-arm64
      - name: Load runtime images
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/runtime-image/orkestr-image.tar.gz"
          docker load --input "$RUNNER_TEMP/runtime-image-arm64/orkestr-image-arm64.tar.gz"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push release image
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]
          docker tag orkestr-ci:candidate "$IMAGE:$GITHUB_REF_NAME-amd64"
          docker tag orkestr-ci:candidate-arm64 "$IMAGE:$GITHUB_REF_NAME-arm64"
          docker push "$IMAGE:$GITHUB_REF_NAME-amd64"
          docker push "$IMAGE:$GITHUB_REF_NAME-arm64"
          # One tag for both architectures, and latest points to the same index.
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:latest" "$IMAGE:$GITHUB_REF_NAME-amd64" "$IMAGE:$GITHUB_REF_NAME-arm64"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
