[package]
name = "orkestr-v2-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Explicit offline harness only; never enabled by server bootstrap.
fixture-test-controls = []

[dependencies]
orkestr-v2-contracts = { path = "../contracts" }
orkestr-v2-domain = { path = "../orkestr-domain" }
orkestr-v2-application = { path = "../application" }
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }
# IANA zone rules are bundled so timer DST arithmetic never depends on host tzdata.
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
# age file format (X25519 recipients) for attachment objects at rest.
age = { version = "=0.11.2", default-features = false }
