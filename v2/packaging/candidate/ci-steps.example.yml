# Coordinator-owned workflow insertion after paired release artifacts exist.
# CANDIDATE_DIR is an explicit fresh output outside checkout; BASE_IMAGE is pinned.
# This fragment performs no builds, starts, publication or deployment.
- name: Verify paired candidate packaging source
  run: |
    python3 -B -m unittest discover -s v2/packaging/candidate/tests -v
    python3 -B -m unittest discover -s v2/packaging/docker/tests -v
- name: Assemble same-source Linux release candidate
  run: |
    python3 -B v2/packaging/candidate/package_candidate.py assemble \
      --binary "$PAIR_DIR/server" --ui "$PAIR_DIR/ui" \
      --paired "$PAIR_DIR/paired-artifacts.json" --output "$CANDIDATE_DIR" \
      --base "$BASE_IMAGE" --port "$ASSIGNED_PORT"
    sh v2/packaging/candidate/ci-verify.sh "$CANDIDATE_DIR"
- name: Record exact distributable identity
  run: |
    python3 -B v2/packaging/candidate/archive.py \
      --candidate "$CANDIDATE_DIR" --output "$CANDIDATE_ARCHIVE" \
      > "$ARCHIVE_RECEIPT"
