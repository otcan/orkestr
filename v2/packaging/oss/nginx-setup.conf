daemon off;
master_process off;
pid /tmp/orkestr-nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/orkestr-client;
    proxy_temp_path /tmp/orkestr-proxy;
    fastcgi_temp_path /tmp/orkestr-fastcgi;
    uwsgi_temp_path /tmp/orkestr-uwsgi;
    scgi_temp_path /tmp/orkestr-scgi;
    client_max_body_size 16m;
    server {
        listen 0.0.0.0:19823;
        # Unconfigured mode only (runtime.py): browser setup page and service.
        # nginx.conf, used once configured, routes neither.
        location = /setup { return 302 /setup/; }
        location /setup/ {
            alias /opt/orkestr/source/v2/packaging/oss/setup/;
            index index.html;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
        location /api/v2/oss-setup/ {
            proxy_pass http://unix:/state/setup/setup.sock:;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
        location / {
            proxy_pass http://127.0.0.1:19822;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
