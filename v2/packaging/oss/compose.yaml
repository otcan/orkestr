name: orkestr-v2-beta
services:
  orkestr:
    image: orkestr-v2-beta:local
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: v2/packaging/oss/Dockerfile
      # Only builds need the exact public commit. The quickstart writes it to
      # v2/packaging/oss/.env, so everyday exec/logs/restart/down commands work
      # in any terminal; a build without it is refused by the Dockerfile.
      args:
        SOURCE_COMMIT: ${ORKESTR_SOURCE_COMMIT:-}
    ports:
      - "127.0.0.1:19822:19823"
    volumes:
      - state:/state
      - credentials:/credentials
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    # Root manager verifies the exact dropped server via /proc/<pid>/exe.
    # Provider UID 10001 has no effective capabilities; no host PID namespace.
    cap_add:
      - SYS_PTRACE
    pids_limit: 256
    stop_grace_period: 45s
    restart: "no"
    healthcheck:
      test: [CMD, /usr/bin/python3, -I, -S, -B, /opt/orkestr/source/v2/packaging/oss/runtime.py, health]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  state:
  credentials:
