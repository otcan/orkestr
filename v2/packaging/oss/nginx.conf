daemon off;
master_process off;
pid /tmp/orkestr-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/orkestr-client;
    proxy_temp_path /tmp/orkestr-proxy;
    client_max_body_size 16m;
    server {
        listen 0.0.0.0:19823;
        location / {
            proxy_pass http://127.0.0.1:19822;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
