[workspace]
resolver = "2"
members = ["crates/orkestr-domain", "crates/orkestr-demo"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "=2.0.17"
tempfile = "=3.23.0"
