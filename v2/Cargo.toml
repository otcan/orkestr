[workspace]
resolver = "2"
members = ["crates/orkestr-domain", "crates/contracts", "crates/application", "crates/store-sqlite", "apps/server"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["serde"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "=0.10.9"
