[package]
name = "orkestr-v2-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Candidate-only: coordinator registers matching reviewed server composition before use.
execution-controls = []
web = ["dioxus/web", "dep:web-sys"]
mobile = ["dioxus/mobile"]

[dependencies]
orkestr-v2-contracts = { path = "../../crates/contracts" }
serde.workspace = true
serde_json.workspace = true
dioxus = { version = "=0.7.3", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }

web-sys = { version = "=0.3.106", optional = true, features = ["Location"] }

[[bin]]
name = "orkestr-v2-ui"
path = "src/main.rs"
