[package]
name = "orkestr-v2-desktop"
version = "2.0.0-beta.3"
edition = "2021"
license = "MIT"
publish = false
description = "Orkestr desktop app: runs the local Orkestr server and shows its UI"

# A standalone workspace: Tauri, GTK and WebKit stay out of the server
# workspace, its lockfile and its CI. Build with this directory's Cargo.lock.
[workspace]

[lib]
name = "orkestr_desktop"
path = "src/lib.rs"

[[bin]]
name = "orkestr-v2-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
# No "zip" feature: Windows updates are the signed NSIS installer itself, so
# the zip extractor (RUSTSEC-2026-0367/0368/0369) is not compiled in.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"
