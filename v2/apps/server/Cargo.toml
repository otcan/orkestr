[package]
name = "orkestr-v2-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orkestr-runtime = { path = "../../crates/orkestr-runtime" }
orkestr-v2-mail-reader = { path = "../../crates/mail-reader" }
orkestr-v2-contracts = { path = "../../crates/contracts" }
orkestr-v2-application = { path = "../../crates/application" }
orkestr-v2-store-sqlite = { path = "../../crates/store-sqlite" }
orkestr-v2-restricted = { path = "../../crates/restricted" }
axum = "=0.8.6"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
sha1 = "=0.10.7"
# V1 encrypted inbound uploads (age to the V1-issued session recipient).
age = { version = "=0.11.2", default-features = false }
argon2 = { version = "=0.5.3", features = ["std"] }
async-stream = "=0.3.6"
# gzip for API JSON and precompressed static UI assets (already in Cargo.lock).
flate2 = "=1.1.10"
# statvfs("/") for the host metrics panel (already in Cargo.lock).
rustix = { version = "=1.1.5", features = ["fs", "process", "param"] }

[dev-dependencies]
# Synthetic browser identities for the sealed-attachment HTTP tests.
age = { version = "=0.11.2", default-features = false }
