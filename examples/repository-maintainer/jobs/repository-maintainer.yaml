# Example A: repository maintainer (docs/spec/agent-job.md). All values are fake.
# Runs offline: `repo.*` tools act on the local git repository at
# inputs.repository_path, and `github.*` tools act on Orkestr's local fake code
# host (inputs.code_host: fake). The simulated provider replays the script; set
# agent.provider to codex or claude-code to let a real agent decide the steps.
apiVersion: orkestr/v0
kind: AgentJob
metadata:
  name: repository-maintainer-example
  description: Fix a reported issue on a branch, open one pull request, merge after approval.
triggers:
  - type: api
  - type: webhook
    name: issue-opened
    secret_ref: vault://example-webhook-secret
    event_id: /delivery_id
agent:
  provider: simulated
task:
  prompt: |
    Read the triggering issue for the repository at inputs.repository_path. Prepare
    a fix on a branch, open one pull request and merge it once approved.
  inputs:
    repository_path: ../repo        # relative to this file
    code_host: fake
    simulated_script:
      - say: Reading the repository.
      - tool: repo.read
        args: { file: README.md }
      - tool: repo.branch.push
        args: { branch: orkestr/issue-7, file: FIX.md, content: "Fixed issue 7.\n", message: "fix: issue 7" }
      - tool: github.pull_request.create
        args: { repository: example-org/example-repo, head: orkestr/issue-7, title: "fix: issue 7" }
      - tool: github.pull_request.merge
        args: { repository: example-org/example-repo, head: orkestr/issue-7 }
      - output: { summary: Opened and merged one pull request for issue 7. }
permissions:
  tools:
    allow: [repo.read, repo.branch.push, github.pull_request.create]
    approval_required: [github.pull_request.merge]
    deny: [repo.branch.force_push]
runtime:
  max_attempts: 3
  timeout: 10m
  concurrency: queue
  retry:
    initial_delay: 1s
    max_delay: 30s
